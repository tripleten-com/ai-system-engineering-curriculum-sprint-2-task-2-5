# Coldline - Task 2.5
# File: .github/workflows/protected-answers.yml
# Component: Trusted answer correctness
# Purpose: Check an inert answer file against a pinned private grading release.
# Interacts With: GitHub API and curriculum-owned answer assets
# Sprint/Task: Sprint 2 - Project 2 / Task 2.5
# Concepts: Public/protected separation
# Tools: GitHub Actions, Python

name: Task 2.5 answer correctness
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  answer-correctness:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.head.repo.full_name == github.repository
    environment: coldline-protected-grading
    name: Task 2.5 answer correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create a short-lived token for the trusted result issuer
        id: result-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.COLDLINE_GRADING_APP_ID }}
          private-key: ${{ secrets.COLDLINE_GRADING_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Mark the exact PR commit pending
        env:
          GH_TOKEN: ${{ steps.result-token.outputs.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state=pending -f context="Task 2.5 protected answers" \
            -f description="Trusted answer evaluation is running" > /dev/null
      - name: Require provisioned immutable grading release
        env:
          COLDLINE_GRADING_SOURCE_SHA: ${{ vars.COLDLINE_GRADING_SOURCE_SHA }}
          GRADING_READ_TOKEN: ${{ secrets.COLDLINE_GRADING_READ_TOKEN }}
        shell: bash
        run: |
          if [[ ! "$COLDLINE_GRADING_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ -z "$GRADING_READ_TOKEN" ]]; then
            echo "Grading infrastructure error: the course must provision a pinned grading release and read credential."
            exit 2
          fi
      - name: Check out only the trusted private grading release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tripleten-com/ai-system-engineering-curriculum
          ref: ${{ vars.COLDLINE_GRADING_SOURCE_SHA }}
          token: ${{ secrets.COLDLINE_GRADING_READ_TOKEN }}
          path: trusted
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install trusted pinned tools
        working-directory: trusted/task-codebases/sprint-1/task-1-1
        run: |
          python infra/scripts/bootstrap.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Materialize the matching trusted Task
        working-directory: trusted/task-codebases/scripts
        run: >-
          uv run --frozen python materialize_task.py
          --task 2.5 --dest "$RUNNER_TEMP/trusted-task"
      - name: Retrieve only the immutable candidate answer file
        id: retrieve
        env:
          COLDLINE_PR_READ_TOKEN: ${{ github.token }}
        run: |
          set +e
          python trusted/task-codebases/.authoring/evaluators/fetch_pr_submission.py --task 2.5 --task-root "$RUNNER_TEMP/trusted-task" --output "$RUNNER_TEMP/candidate/submission.yaml"
          fetch_exit=$?
          echo "exit_code=$fetch_exit" >> "$GITHUB_OUTPUT"
          exit "$fetch_exit"
      - name: Run protected answer correctness
        id: grade
        working-directory: trusted
        run: |
          set +e
          uv run --project "$RUNNER_TEMP/trusted-task" --frozen python task-codebases/.authoring/evaluators/sprint_2_submission.py --task 2.5 --task-root "$RUNNER_TEMP/trusted-task" --submission "$RUNNER_TEMP/candidate/submission.yaml" --answer-key task-codebases/.authoring/answer-keys/sprint-2/task-2-5/submission-answer-key.yaml
          grade_exit=$?
          echo "exit_code=$grade_exit" >> "$GITHUB_OUTPUT"
          exit "$grade_exit"

      - name: Report the result on the exact PR commit
        if: always()
        env:
          GH_TOKEN: ${{ steps.result-token.outputs.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FETCH_EXIT_CODE: ${{ steps.retrieve.outputs.exit_code }}
          GRADE_EXIT_CODE: ${{ steps.grade.outputs.exit_code }}
          GRADE_OUTCOME: ${{ steps.grade.outcome }}
        run: |
          state=failure
          if [ "$GRADE_OUTCOME" = success ]; then
            state=success
          elif [ "$FETCH_EXIT_CODE" = 1 ]; then
            state=failure
          elif [ "$GRADE_EXIT_CODE" != 1 ]; then
            state=error
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$PR_HEAD_SHA" \
            -f state="$state" -f context="Task 2.5 protected answers" \
            -f description="See trusted grading workflow for field feedback or infrastructure errors" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
